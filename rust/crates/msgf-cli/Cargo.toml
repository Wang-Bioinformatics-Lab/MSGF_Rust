[package]
name = "msgf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line front-end for MSGF_Rust: database search, PSM rescoring, target-decoy FASTA construction and FDR"

[[bin]]
name = "msgf"
path = "src/main.rs"

[dependencies]
msgf-chem = { path = "../msgf-chem" }
msgf-db = { path = "../msgf-db" }
msgf-fdr = { path = "../msgf-fdr" }
msgf-io = { path = "../msgf-io" }
msgf-scorer = { path = "../msgf-scorer" }
msgf-genfunc = { path = "../msgf-genfunc" }
msgf-search = { path = "../msgf-search" }
rayon = { workspace = true }
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
serde_json = { workspace = true }
